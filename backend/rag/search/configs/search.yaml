# 검색 설정 — 비워 두면 router.DEFAULTS. 바꿀 값만 적는다
# 가중치는 `python -m backend.rag.search.tune` 이 dev 문항으로 맞춘 값을 configs/search.tuned.yaml 에 써 준다 (확인 후 여기로 복사)
#
# dense: hcx                      # hcx | none | hash — 1단계부터 BM25 와 함께 쓰는 임베딩
# rrf_k: 20
# weights: {q_dense: 1.6, q_value: 1.6, q_title: 1.4, q_lex: 1.0, q_ngram: 0.8, rw_lex: 0.7}
# feas: {year_floor: 0.12, year_partial: 0.6, age_miss: 0.5, extra_dim: 0.12}
# llm_rerank: {enabled: false, top_n: 12}     # true 면 질의 단위마다 HCX 1회로 상위 후보를 다시 줄 세움
# siblings: {enabled: true, window: 12, margin: 0.75, max_outside: 3}   # [11-16] 형제 표 해소 (siblings.py)
# roles: {enabled: true, den_miss: 0.35, den_dim: 0.2, den_survey: 1.5}  # [11-16] 분모 단위 ('인구' 뿐인 하위 질의)
# llm_rerank: {add_siblings: 4}                                           # [11-16] LLM 후보에 상위 무리의 빠진 형제를 끼움
# concepts: {enabled: true, path: null, add: 3}                         # [11-16] 개념 카탈로그 (concepts.py build → <CSV 값 사전>/concepts.json)
