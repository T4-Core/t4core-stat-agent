# push · PR 마다: 백엔드 테스트(+ 실제 PostgreSQL · pgvector · Redis 로 AWS DB 시험) · 프론트엔드 빌드 · Docker 이미지 빌드
# RAG · 에이전트 코드를 고쳐도 AWS 배포(STAT_BACKEND=postgres)가 깨지지 않는지 여기서 확인된다 (tests/test_db_*.py)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:                       # 한 서버에 DB 둘 (t4core = backend PostgreSQL, t4vec = db-server pgvector 역할)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: t4core
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONUTF8: "1"
      T4_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/t4core
      T4_TEST_VECTOR_DB_URL: postgresql://postgres:ci@localhost:5432/t4vec
      T4_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # Dockerfile 과 같은 판
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 의존성
        run: pip install -r requirements.txt "pytest>=8.0" "httpx>=0.27"
      - name: 벡터 DB 만들기
        run: PGPASSWORD=ci psql -h localhost -U postgres -c "CREATE DATABASE t4vec"
      - name: 테스트 (DB 시험 포함)
        run: pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # frontend/web/Dockerfile 과 같은 판
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 배포 compose 문법
        run: |
          printf 'PG_PASSWORD=ci\n' > deploy/backend/.env
          printf 'VECTOR_PG_PASSWORD=ci\n' > deploy/db/.env
          cp deploy/frontend/.env.example deploy/frontend/.env
          docker compose --env-file deploy/backend/.env -f deploy/backend/compose.yml config --quiet
          docker compose --env-file deploy/db/.env -f deploy/db/compose.yml config --quiet
          docker compose --env-file deploy/frontend/.env -f deploy/frontend/compose.yml config --quiet
      - name: 백엔드 이미지 빌드 · 불러오기 확인
        run: |
          docker build --target runtime -t t4core-backend:ci .
          docker run --rm -e STAT_BACKEND=postgres t4core-backend:ci python -c "import backend.main, backend.db.stats, backend.db.vectors, psycopg, redis; print('ok')"
