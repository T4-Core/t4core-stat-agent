# db-server (t3.medium · 4 GiB · 20 GB) — PostgreSQL 16 + pgvector (임베딩 전용)
#
#   docker compose --env-file deploy/db/.env -f deploy/db/compose.yml up -d
#
# 포트 5432 는 모든 인터페이스에 열지만, 보안 그룹에서 backend-server 의 프라이빗 IP(/32)만 허용해야 한다.
# 스키마(vec)는 backend 가 시작할 때 만든다 (DB_MIGRATE_ON_START=on) — 여기서는 확장만 미리 켬.
name: t4core-db

services:
  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${VECTOR_PG_USER:-t4core_vector}"
      POSTGRES_PASSWORD: "${VECTOR_PG_PASSWORD:?deploy/db/.env 에 VECTOR_PG_PASSWORD}"
      POSTGRES_DB: "${VECTOR_PG_DB:-t4core_vector}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2560MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=40
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - "${VECTOR_HOST_DIR:-/srv/t4core/vectordata}:/var/lib/postgresql/data"
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "512mb"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
