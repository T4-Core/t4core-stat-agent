# 내 PC 에서 세 서버를 한 번에 (통합 확인용)
#   deploy/backend/.env 의 VECTOR_DB_URL=postgresql://t4core_vector:<VECTOR_PG_PASSWORD>@vector:5432/t4core_vector
#   docker compose --env-file deploy/local/.env -f deploy/local/compose.yml up -d --build
name: t4core-local

include:
  - ../backend/compose.yml
  - ../frontend/compose.yml

services:
  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: t4core_vector
      POSTGRES_DB: t4core_vector
      POSTGRES_PASSWORD: "${VECTOR_PG_PASSWORD:?Set VECTOR_PG_PASSWORD for local testing}"
    volumes:
      - vector_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vector_data:
