name: t4core-local

include:
  - ../backend/compose.yml
  - ../frontend/compose.yml

services:
  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: t4core_vector
      POSTGRES_DB: t4core_vector
      POSTGRES_PASSWORD: "${VECTOR_PG_PASSWORD:?Set VECTOR_PG_PASSWORD for local testing}"
    volumes:
      - vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vector_data: