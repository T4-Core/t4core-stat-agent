name: t4core-vector

services:
  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${VECTOR_PG_USER:-t4core_vector}"
      POSTGRES_PASSWORD: "${VECTOR_PG_PASSWORD:?Set VECTOR_PG_PASSWORD}"
      POSTGRES_DB: "${VECTOR_PG_DB:-t4core_vector}"
    volumes:
      - "${VECTOR_HOST_DIR:-/srv/t4core/vectordata}:/var/lib/postgresql/data"
      # 데이터 폴더가 비어 있을 때 한 번만 실행됨
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # backend EC2 에서 접속해야 하므로 전체 인터페이스에 바인딩. 접근 제한은 SG 가 담당
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "256mb"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"