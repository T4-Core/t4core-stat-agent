# core34 — 회귀 비교용 버전 고정(immutable) 세트. 문항 추가 · 의미 변경 금지
# 기대값(values)은 5회차(11-18) 계산값 중 기준선 문서에서 원본 View 와 일치로 판정된 문항만 옮겼다.
# 단위는 평가 정규형(ratio · pp · times · 원단위). verified=false: 제3자 대조 전
name: core34
version: '1.0'
frozen: true
questions:
- id: Q01
  group: 연산 12종
  question: 2025년 서울 인구는?
  scope: in
  sub_questions:
  - key: pop
    match:
      item_any:
      - 인구
      op_any:
      - raw
      region_any:
      - 서울
    answerable_when:
    - when:
        view_has_row:
          item: 인구
          period: '2025'
          region: 서울
      expect: answer
    - expect: hold
      hold_reason: from_predicate
    m2:
      acceptable_charts:
      - null
      - bar
      measure: null
    m3:
      op: raw
      operands: []
  required_caveats:
  - projection
  expect_text: 'raw: 서울 2025년 값 하나'
  verified: false
  notes: 표가 장래인구추계면 추계 고지가 필수. 실제 인구 표가 선택되면 고지 불필요
