# baseline 의 HCX 임베딩을 로컬 bge-m3 로 (HuggingFace 에서 받음, GPU 있으면 GPU)
requires: [sentence_transformers]
description: BM25(kiwi) 50 → 조건 → 로컬 BAAI/bge-m3 재정렬 (sentence-transformers)
extends: baseline
rerank:
  - {type: condition, top_n: top_k}
  - {type: embed, embedder: {type: sentence_transformers, model: BAAI/bge-m3, device: auto, max_seq_length: 512}, respect_cost: true}
