# BM25 와 dense 를 처음부터 함께 (dense 가 BM25 가 놓친 표도 후보로 올림) → RRF → 조건 확인
# 첫 실행 때 코퍼스 전체(표 설명문)를 HCX 로 임베딩 (기존 embed_cache.sqlite 에 쌓이므로 한 번만)
description: BM25(kiwi) 50 + HCX bge-m3 전체 50 → RRF → 조건 확인
corpus: {type: table_text}
retrievers:
  - {name: bm25, type: bm25, k: 50, tokenizer: {type: kiwi, variant: table}}
  - {name: dense, type: dense, k: 50, embedder: {type: hcx_bge_m3}}
fusion: {type: rrf, k: 60, weights: {bm25: 1.0, dense: 1.0}, pool: 50}
rerank:
  - {type: condition, top_n: 20}   # [CHANGED 11-12] 이전 top_k(10): dense 가 20개를 보고 최종 top_k
top_k: 10
