# 현재 검색(backend/rag/retrieval/table_search.search) 재현 — 같은 질의·슬롯이면 순위가 같아야 함 (tests/v4 에서 확인)
#   BM25(kiwi, 표 색인 토큰) 상위 50 → 슬롯 조건 확인(resolve.rerank) 상위 top_k → HCX bge-m3 로 (cost, -dense) 순
description: 현재 검색 재현 — BM25(kiwi) 50 → 조건 확인 → 상위 top_k → HCX bge-m3 재정렬
corpus: {type: table_text}
query: {prep: none}                 # views.run_query 처럼 resolve.search_query 를 거친 문장을 넣는다 (lab 이 처리)
retrievers:
  - {name: bm25, type: bm25, k: 50, tokenizer: {type: kiwi, variant: table}}
rerank:
  - {type: condition, top_n: 20}   # [CHANGED 11-12] 이전 top_k(10): dense 가 20개를 보고 최종 top_k
  - {type: embed, embedder: {type: hcx_bge_m3}, respect_cost: true}
top_k: 10
