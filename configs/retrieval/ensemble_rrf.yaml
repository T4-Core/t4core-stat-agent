# 앙상블: 토크나이저가 다른 BM25 두 개 + dense → RRF → 조건 → 후보 안에서 dense 재정렬 순위와 RRF 순위를 다시 RRF
description: BM25(kiwi) + BM25(글자 n-gram) + HCX bge-m3 → RRF → 조건 → 단계 순위 앙상블
corpus: {type: table_text}
retrievers:
  - {name: bm25_kiwi, type: bm25, k: 50, tokenizer: {type: kiwi, variant: table}}
  - {name: bm25_char, type: bm25, k: 50, tokenizer: {type: char_ngram, n: [2, 3]}}
  - {name: dense, type: dense, k: 50, embedder: {type: hcx_bge_m3}}
fusion: {type: rrf, k: 60, pool: 50}
rerank:
  - {type: condition, top_n: 20}
  - {type: embed, name: embed, embedder: {type: hcx_bge_m3}, respect_cost: true}
  - {type: rrf_stages, stages: [fuse, embed], top_n: top_k}
top_k: 10
