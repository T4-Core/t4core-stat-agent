# 일상어 → 통계어 (정규식 → 더할 말). term_dict.json 에 없는 구어 표현만 — 질문에서 맞으면 검색 문장에 통계어를 더한다
# 원문 단어는 지우지 않는다 (더하기만). 골든셋 P(일상어) 문항에서 정답 표를 못 찾은 표현을 보고 채운다
# 한 글자 말은 앞뒤가 한글이 아닐 때만 맞도록 경계를 둔다
- ['(?<![가-힣])집(?:들)?(?:이|은|는|의|에|을|도)?(?![가-힣])|몇\s*채|주거지', [주택]]
- ['사는\s*사람|살고\s*있는\s*사람|거주하는\s*사람|주민(?:들)?(?![등록])', [인구]]
- ['아기|아이를\s*낳|태어난|낳은', [출생]]
- ['(?:숨진|죽은|돌아가신|사망한)', [사망]]
- ['결혼(?:한)?\s*커플|부부가\s*된|결혼한\s*(?:사람|건)', [혼인건수, 혼인]]
- ['헤어진|갈라선|이혼한', [이혼]]
- ['이사\s*온|옮겨\s*온|들어온|전입\s*온', [전입]]
- ['이사\s*간|옮겨\s*간|옮긴|나간|빠져나간', [전출]]
- ['어르신|노인|고령층|나이\s*든', [고령자, 고령인구]]
- ['외국\s*사람|외국\s*출신|다른\s*나라\s*출신', [외국인]]
- ['(?<!결혼)(?<!결혼 )이민자(?:들)?(?!.{0,12}(?:교육|프로그램))|이민\s*(?:온|오는|와서)|이주민(?:들)?', [체류외국인, 외국인주민]]
- ['국적을\s*(?:딴|얻은|취득한)|귀화', [한국국적을 취득한 자, 국적취득]]
- ['국제결혼\s*가정|다문화\s*가정', [다문화가구, 국제결혼가정]]
- ['결혼\s*이민자?|결혼해서\s*온', [결혼이민자, 국제결혼 이주자]]
- ['일하는\s*외국인|외국인\s*노동자', [외국인근로자]]
- ['월세', [보증부월세, 무보증월세]]
- ['전세', [전세]]
- ['내\s*집|자가', [자기집]]
- ['엄마|어머니|산모', [모의 연령, 모]]
- ['쌍둥이', [쌍태아, 다태아]]
- ['몸무게', [출생시 체중]]
- ['앞으로|장래|미래|전망|예상', [추계]]
- ['가장(?:이)?\s*(?:여자|여성)|여성\s*가구주|가구주가\s*(?:여자|여성)', [가구주의 성, 여자]]
- ['여성', [여자]]
- ['남성', [남자]]
- ['유학\s*온|유학생', [유학생]]
- ['불법\s*체류', [불법체류]]
- ['한부모|편부모', [한부모가구]]
- ['장애가\s*있는|장애인', [장애인]]
# ── retrieval_golden 의 concept 문항에서 못 찾은 표현 ──
- ['사람(?:들)?(?:이|은|의)?\s*(?:몇|얼마)|몇\s*명|인구\s*수|사람\s*수', [인구]]
- ['몰리|빠져나가|유입|유출|순유입|순유출', [순이동, 전입, 전출, 인구이동]]
- ['수도권', [수도권, 시도간 이동, 순이동]]
- ['이사하는\s*이유|이사\s*(?:사유|이유)|옮기는\s*이유', [전입사유, 이동사유]]
- ['이사|이주', [인구이동, 이동자수]]
- ['혼자\s*사는|혼자\s*살|독거|나\s*홀로', [1인가구]]
- ['(?:노인|어르신|고령자?)\s*(?:이|가)?\s*혼자', [고령자 1인가구, 고령자, 1인가구]]
- ['몇\s*살에\s*(?:주로\s*)?(?:죽|사망)|죽는\s*나이|사망\s*연령', [사망자수, 연령별 사망, 사망률]]
- ['죽는|죽은|사망하는', [사망]]
- ['시집\s*온|장가\s*온|결혼해서\s*(?:온|들어온)', [결혼이민자, 국제결혼 이주자, 외국인 아내]]
- ['해외로\s*나가|외국으로\s*나가|이민\s*(?:간|가는)|출국', [출국자, 국제이동, 내국인 출국]]
- ['안\s*돌아오|돌아오지\s*않', [국제순이동, 장기 출국]]
- ['들어오는\s*외국인|입국하는|입국', [입국자, 국제이동]]
- ['우리나라에\s*사는\s*외국인|국내\s*(?:거주|체류)\s*외국인|사는\s*외국인', [체류외국인, 외국인주민, 등록외국인]]
- ['애\s*낳|아이\s*낳|아이를\s*낳|출산하', [출생아수, 출생]]
- ['아이\s*없(?:이|는)|자녀\s*없(?:이|는)|무자녀|딩크', [부부, 부부가구, 세대구성, 1세대]]
- ['부모(?:님)?(?:이)?랑\s*(?:같이|함께)\s*사는|부모와\s*(?:같이|함께)\s*사는|캥거루', [가구주와의 관계, 자녀, 부모 동거]]
- ['결혼(?:을)?\s*늦게|만혼|늦은\s*결혼', [평균초혼연령, 초혼연령]]
- ['엄마\s*나이|산모\s*나이|출산\s*나이|노산', [모의 평균 출산연령, 모의 연령]]
- ['일하는\s*나이|일할\s*나이|경제활동\s*연령', [생산연령인구]]
- ['고령화|늙어', [고령인구, 고령인구비율, 노령화지수]]
- ['출퇴근|통근|통학', [통근통학]]
- ['반려동물|애완동물', [반려동물]]
- ['언제부터\s*줄|줄어들(?:지|기)|감소\s*시작|정점', [추계인구, 인구성장률, 장래인구추계]]
- ['피라미드', [성 및 연령별 추계인구, 연령별 인구]]
- ['등록\s*센서스', [인구총조사, 등록센서스]]
- ['연앙', [연앙인구]]
# ── 합성 셋 dev 레코드의 P 실패에서 고른 것 (tuning/colloq_mine → 사람이 고름). heldout 레코드는 보지 않음 ──
- ['이민자(?:들)?.{0,12}(?:교육|프로그램)|교육(?:을|에)?\s*(?:얼마나\s*)?(?:더\s*)?(?:많이\s*)?참여', [조기적응프로그램, 사회통합프로그램, 이수현황]]
