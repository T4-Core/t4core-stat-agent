- ['이혼(?:한|하는)?\s*(?:이유|사유)|때문에\s*이혼|(?:로|으로)\s*인한\s*이혼', [이혼사유]]
- ['미성년\s*자녀(?:가)?\s*(?:셋|둘|하나|한\s*명|두\s*명|세\s*명)|자녀가\s*(?:셋|둘)', [미성년자녀수]]
- ['교육\s*수준|학력|최종\s*학교', [교육정도]]
