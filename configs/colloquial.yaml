- ['주택\s*(?:이외|외)의?\s*(?:거처|거주지|곳)', [주택이외의 거처]]
- ['거주지|사는\s*곳', [거처]]
- ['전체적인\s*이동|총\s*이동|이동\s*(?:전체|총)', [총이동]]
- ['대한민국\s*전체|우리나라\s*전체|나라\s*전체', [전국]]
