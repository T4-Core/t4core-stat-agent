# 파이프라인 설정 (backend/core/settings.py). 다른 파일을 쓰려면 환경변수 PIPELINE_CONFIG=<경로>
# API 요청의 overrides 로 값 일부만 바꿀 수 있고, 바꾼 값은 trace 의 params 에 남는다

# ── 필수 슬롯·시점 규칙 ──
required_slots: [시점, 지역, 대상]       # 대상 = 대상 또는 지표 값이 CSV 의 행(항목·분류 값)에 있으면 충족
base_year: 2026                          # '최근·요즘' 이 가리키는 해 (base_year_mode: fixed 일 때)
base_year_mode: data                     # data = CSV 값 사전의 최신 연도(추계 연도 제외) / fixed = base_year
trend_years: 5                           # '추이·변화' 의 기간 (기준 해 포함 5개 해)
recent_words: [최근, 요즘, 현재, 지금, 근래, 요새]
trend_words: [추이, 변화, 흐름, 추세, 동향, 변동]
trend_intents: [추이]                    # 이 의도면 시점이 없을 때 추이 규칙 적용
year_axes: [연도, 연도별, 년도, 해, 시점, 기간, 연간]   # 이 비교축이면 '해끼리 비교' ('혼인건수가 가장 적은 해는?')
year_compare_years: 0                    # 해끼리 비교인데 시점이 없을 때: 0 = 표의 수록 기간 전체 / N = 최근 N년 (기준 해 포함)
n_options: 20                            # 되묻기 후보 수
clarify_mode: soft                       # soft = 필수 슬롯이 없어도 검색 (없는 시점=최신, 지역=전국). 되묻기 후보는 clarifications 에 남김
                                         # strict = 필수 슬롯이 없으면 needs_clarification 으로 멈춤

# ── 동의어·CSV 값 사전 ──
csv_scope: selected                      # selected = catalog.csv selected 표만 / all = raw 폴더 전체
min_alias_len: 2                         # 한 글자 표현은 다른 단어 안에서 잘못 잡혀 제외
fuzzy_cutoff: 0.72                       # 비슷한 이름 후보(되묻기 제안)의 최소 유사도
contain_min_len: 2                       # 포함 매칭(인구 ⊂ 총인구수)에 쓰는 최소 길이

# ── 검색 문장 ──
search_text_mode: rule                   # rule = 재작성 문장 + CSV 표준 이름 (추가 HCX 없음) / llm = 검색용 문장을 HCX 로 한 번 더
question_terms: true                     # 질문 원문의 CSV 표현 중 슬롯에 없는 것을 검색 문장·View 보조 단어(원문표현)로
question_terms_max_share: 0.15           #   전체 표의 이 비율 이하에만 나오는 표현만 ('인구'·'가구' 같은 흔한 말 제외)
question_terms_max: 6
role_units: true                         # 분모('…중 비율'·'천 명당')·조건('…가 N명 이상')을 검색 단위로 더함

# ── 정규 어휘 사전 (근거 없는 재작성 값 지우기, docs/VOCAB_GROUNDING.md) ──
vocab_check: drop                        # drop = 표 항목·분류 코드·질문 원문·용어 사전 어디에도 없는 값 지움 / log = 기록만 / off
vocab_slots: [대상, 지표, 조건]
vocab_alias_fill: true                   # 질문의 별칭('싱글맘') → 정규 이름('모+미혼자녀')을 조건에 더함
vocab_path: ""                           # 비우면 OKF 빌드의 vocab.json (okf_use) → CSV_INDEX_DIR/vocab.json → 없으면 CSV 값 사전으로 만듦
# 벡터 후보 — 질문 낱말이 사전에 없을 때 (벡터 파일: python -m backend.rag.query_analyzer.vocab build --embed hcx. 없으면 건너뜀)
vocab_suggest: log                       # off / log = 후보만 기록 / hcx = HCX 가 후보 목록 안에서 같은 뜻만 고름 (조건·지표에 더함)
vocab_suggest_embedder: hcx              # 벡터 파일을 만든 임베더와 같아야 함
vocab_suggest_k: 5
vocab_suggest_min_score: 0.55            # 코사인 하한 (임베더마다 다름 — log 로 보고 조정)
vocab_suggest_max_terms: 3
vocab_suggest_learn: true                # hcx 가 고른 짝 → 학습 사전 '승인 대기' (POST /api/v1/rag/lexicon/learn approve=true 로 승인)

# ── OKF 지식 카탈로그 (storage/okf · docs/OKF_FORMAT.md) ──
okf_use: true                            # 빌드(storage/okf_build/CURRENT)가 있으면 vocab.json·별칭을 거기서 (없으면 예전대로)
okf_dir: ""                              # 비우면 storage/okf
okf_build_dir: ""                        # 비우면 storage/okf_build

# ── 서브쿼리 ──
split_when_no_common_table: true         # split_policy: no_common_table 일 때, 지표들을 함께 가진 표가 없으면 나눔
split_policy: always                     # always = 지표마다 서브쿼리 / no_common_table = 함께 가진 표가 없을 때만
max_sub_queries: 4

# ── View 묶음 · Point 충돌 · 선택 ──
view_top_k: 10                           # 검색 단위마다 후보 표 수
view_n_views: 3                          # 그중 View 를 만들어 비교할 표 수
view_keep_unusable: true                 # 필수 메타를 못 쓴 View 도 records 로 넘김 (notes 와 함께)
view_main_with_subs: true                # 서브쿼리가 있을 때 본 질의(합친 문장) 단위도 검색할지
view_first_only_when_same: false         # true = View 2개(view_n_views: 2 권장)의 겹치는 교차점 값이 모두 같고 2순위에만 있는
                                         #   교차점이 없으면 1순위만 넘김. 값이 다르면 둘 다 + 사용자 선택, 비교 불가면 둘 다
view_stitch: false                       # true = 같은 통계의 다른 연도 표(configs/search.yaml stitch, period_groups.py)를
                                         #   그 표가 맡은 연도로 View 를 더 만들어 부모 Record 바로 뒤에 넘김 (비교·선택 대상 아님)
view_records_per_unit: 3                 # 검색 단위(본 질의 · 서브쿼리 각각)마다 답변 모듈로 넘길 Record 수. 0 = 기존 동작
                                         #   View 생성 실패·요청 지표 없는 표는 세지 않고 다음 후보로 채움 (view_top_k 안에서)
                                         #   값이 다른 표들의 자동 선택(auto_select)이어도 고르지 않은 표의 Record 를 뒤에 함께 넘김
                                         #   (record.match.selected = false). 사용자가 직접 고른 경우는 고른 무리만
conflict_indicator_core: true            # 지표가 표 이름에만 있을 때(partial) 핵심어로 항목·분류 값을 다시 찾아 match 로
conflict_rel_tol: 0.0                    # 같은 교차점 값이 '다르다' 의 기준: |a-b| > max(abs_tol, rel_tol*max(|a|,|b|))
conflict_abs_tol: 1.0e-9                 #   (단위가 명·천명처럼 배수만 다르면 맞춰서 비교)
conflict_allow_partial: [시점]           # 이 슬롯은 대체 적용(2026 → 최신 2025 등)이어도 비교에 넣음
conflict_preview_points: 6
conflict_max_footnotes: 8
selection_ttl_hours: 168                 # 선택 토큰 유효 시간

# ── 기록 ──
save_runs: false                         # true 면 storage/runs/<run_id>/ 에 단계별 기록
